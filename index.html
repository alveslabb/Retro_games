<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RetroGames 🎮</h1>
        <p>Venda de jogos retro!!!</p>
    </header>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nosso Catálogo!</h2>
                <p>Conheça os jogos disponiveis</p>
            </div>
            <button id="btnCadastrar" type="button"> + Cadastrar Jogo</button>
        </div>
        <section id="listarDiscos" class="listar-discos">
            <p id="mensagemVazia">Nenhum jogo Cadastrado</p>
        </section>
    </main>
    <dialog id="modalCadastro">
        <h2>Novo Jogo</h2>
        <form id="formDisco">
            <label>Nome do Jogo</label>
            <input type="text" id="disco" required>
            <label>Autor do jogo</label>
            <input type="text" id="Artista" required>
            <label>Gênero</label>
            <input type="text" id="genero" required>
            <label>URL da imagem</label>
            <input type="url" id="imagem"
            placeholder="https://site.com/capa.jpg"
            required>
            <label>Preço (R$)</label>
            <input type="number" id="preco" min="0.01"
            step="0.01" required>
            <div class="acoes">
                <button type="button" id="btnCancelar"
                class="cancelar"> cancelar</button>
                <button type="submit">Salvar Jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
